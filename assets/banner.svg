<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 340" width="1280" height="340" role="img" aria-label="POWERVERSE — The Microsoft Power Platform Learning Hub">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080B16"/>
      <stop offset="55%" stop-color="#0C1122"/>
      <stop offset="100%" stop-color="#111831"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#A258C9"/>
      <stop offset="35%" stop-color="#3B82F6"/>
      <stop offset="68%" stop-color="#17B890"/>
      <stop offset="100%" stop-color="#F2C811"/>
    </linearGradient>
    <radialGradient id="g1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A258C9" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#A258C9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#94A3CC" stroke-opacity="0.10" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="52"/>
    </filter>
  </defs>

  <rect width="1280" height="340" fill="url(#bg)"/>
  <rect width="1280" height="340" fill="url(#grid)"/>
  <circle cx="130" cy="40" r="220" fill="url(#g1)" filter="url(#soft)"/>
  <circle cx="1160" cy="300" r="240" fill="url(#g2)" filter="url(#soft)"/>

  <!-- logo -->
  <g transform="translate(88 74)">
    <rect x="0" y="0" width="34" height="34" rx="7" fill="#A258C9"/>
    <rect x="40" y="0" width="34" height="34" rx="7" fill="#3B82F6"/>
    <rect x="0" y="40" width="34" height="34" rx="7" fill="#F2C811"/>
    <rect x="40" y="40" width="34" height="34" rx="7" fill="#17B890"/>
  </g>

  <!-- wordmark -->
  <text x="188" y="126" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="62" font-weight="700" letter-spacing="3">
    <tspan fill="#E8ECF8">POWER</tspan><tspan fill="#F2C811">VERSE</tspan>
  </text>

  <text x="190" y="164" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="21" fill="#9AA5C4" letter-spacing="0.6">
    The Microsoft Power Platform Learning Hub — learn it by running it.
  </text>

  <!-- accent rule -->
  <rect x="190" y="186" width="620" height="3" rx="1.5" fill="url(#sheen)"/>

  <!-- feature pills -->
  <g font-family="JetBrains Mono, Consolas, Menlo, monospace" font-size="15" letter-spacing="0.4">
    <g transform="translate(190 214)">
      <rect width="236" height="40" rx="20" fill="#0B0E1A" stroke="#A258C9" stroke-opacity="0.55"/>
      <circle cx="26" cy="20" r="5" fill="#A258C9"/>
      <text x="44" y="26" fill="#C9D3EE">99 Power Fx functions</text>
    </g>
    <g transform="translate(442 214)">
      <rect width="252" height="40" rx="20" fill="#0B0E1A" stroke="#3B82F6" stroke-opacity="0.55"/>
      <circle cx="26" cy="20" r="5" fill="#3B82F6"/>
      <text x="44" y="26" fill="#C9D3EE">200-record playground</text>
    </g>
    <g transform="translate(710 214)">
      <rect width="188" height="40" rx="20" fill="#0B0E1A" stroke="#17B890" stroke-opacity="0.55"/>
      <circle cx="26" cy="20" r="5" fill="#17B890"/>
      <text x="44" y="26" fill="#C9D3EE">IntelliSense</text>
    </g>
    <g transform="translate(914 214)">
      <rect width="226" height="40" rx="20" fill="#0B0E1A" stroke="#F2C811" stroke-opacity="0.55"/>
      <circle cx="26" cy="20" r="5" fill="#F2C811"/>
      <text x="44" y="26" fill="#C9D3EE">25 interview Qs</text>
    </g>
  </g>

  <text x="190" y="296" font-family="JetBrains Mono, Consolas, Menlo, monospace" font-size="14" fill="#5E6A8C" letter-spacing="1.4">
    POWER APPS · POWER AUTOMATE · POWER BI · POWER PAGES · COPILOT STUDIO · DATAVERSE
  </text>
</svg>
